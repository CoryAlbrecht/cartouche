# Release Build: on a version tag, packages every platform through the shared
# build-packages.yml workflow, then publishes all installers as one GitHub
# Release (all-or-nothing). Release rules are defined in ADR 0018 (and its
# 2026-11-13 amendment); see also PROCESSES.md and GLOSSARY `Release Build`.
name: Build & Release Desktop Packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-packages.yml
    with:
      platforms: all

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Inspect Release Tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cartouche ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/*.deb
            release/*.rpm
            release/*.msi
            release/*.exe
