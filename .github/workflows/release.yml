name: Build & Release Desktop Packages

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Release (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Electron Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}

      - name: Inspect Release Tag & Set Version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          npm pkg set version="${SEMVER}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pre-flight Verification Gates
        run: |
          npm run typecheck
          npm test

      - name: Rebuild native Electron dependencies
        run: npm run rebuild

      - name: Build & Package App
        run: |
          npm run build
          npm run package:linux

      - name: Publish Linux Release Packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cartouche ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            release/*.deb
            release/*.rpm

  build-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Electron Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}

      - name: Inspect Release Tag & Set Version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${SEMVER}" >> $GITHUB_OUTPUT
          npm pkg set version="${SEMVER}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies (bypassing postinstall)
        run: npm ci --ignore-scripts

      - name: Download gdal-async prebuilt binary
        run:
          node
          node_modules/gdal-async/node_modules/@mapbox/node-pre-gyp/bin/node-pre-gyp
          install --directory=node_modules/gdal-async

      - name: Generate gdal-async TypeScript definitions
        run: npm --prefix node_modules/gdal-async run yatag

      - name: Rebuild better-sqlite3 for Electron
        run:
          npx node-gyp rebuild --directory=node_modules/better-sqlite3
          --target=45.0.0 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Ensure gdal-async binding for Electron 45
        shell: bash
        run: |
          GDAL_DIR="node_modules/gdal-async/lib/binding"
          if [ -d "$GDAL_DIR/node-v137-win32-x64" ] && [ ! -d "$GDAL_DIR/electron-v45.0-win32-x64" ]; then
            cp -r "$GDAL_DIR/node-v137-win32-x64" "$GDAL_DIR/electron-v45.0-win32-x64"
          fi

      - name: Pre-flight Verification Gates
        run: |
          npm run typecheck
          npm test

      - name: Build & Package App
        run: npm run build && npm run package:win

      - name: Publish Windows Release Packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cartouche ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            release/*.msi
            release/*.exe

