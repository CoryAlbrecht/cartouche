name: Cleanup Failed & Cancelled Runs

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly at midnight UTC
  workflow_dispatch: # Allows manual trigger via the Actions tab

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed and cancelled workflow runs
        run: |
          gh run list --repo "${{ github.repository }}" --limit 200 --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .databaseId' \
            | while read -r run_id; do
                if [ -n "$run_id" ]; then
                  echo "Deleting run ID: $run_id"
                  gh run delete "$run_id" --repo "${{ github.repository }}"
                fi
              done
