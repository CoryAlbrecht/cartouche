name: Build Desktop Packages (Windows)

on:
  push:
    branches:
      - "version-[0-9]+.[0-9]+.[0-9]+-dev"
      - "version-[0-9]+.[0-9]+.[0-9]+-rc"
      - "version-[0-9]+.[0-9]+.[0-9]+-stable"
      - "version-[0-9]+.[0-9]+.[0-9]+-lts"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Electron Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}

      - name: Calculate & Set Version
        id: version
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          REGEX="^version-([0-9]+\.[0-9]+\.[0-9]+)-(dev|rc|stable|lts)$"
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "Invalid branch pattern '$BRANCH'" && exit 1
          fi
          BASE_VER="${BASH_REMATCH[1]}"
          TYPE="${BASH_REMATCH[2]}"
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          REV_INDEX=$((TOTAL_COMMITS - 1))
          if [ $REV_INDEX -lt 0 ]; then REV_INDEX=0; fi
          FULL_VER="${BASE_VER}-${TYPE}+${REV_INDEX}"

          npm pkg set version="${FULL_VER}"
          echo "full_version=${FULL_VER}" >> $GITHUB_OUTPUT
          if [[ "$TYPE" == "stable" || "$TYPE" == "lts" ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install build dependencies
        run: npm install --global node-gyp

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native Electron dependencies
        run: npm run rebuild

      - name: Build & Package App
        run: |
          npm run build
          npm run package:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.full_version }}
          name: Cartouche v${{ steps.version.outputs.full_version }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            release/*.msi
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
