name: Build Desktop Packages (Windows)

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches:
      - "version-[0-9]+.[0-9]+.[0-9]+-dev"
      - "version-[0-9]+.[0-9]+.[0-9]+-rc"
      - "version-[0-9]+.[0-9]+.[0-9]+-stable"
      - "version-[0-9]+.[0-9]+.[0-9]+-lts"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Cache Electron Binaries
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package.json') }}

      - name: Calculate & Set Version
        id: version
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          REGEX="^version-([0-9]+\.[0-9]+\.[0-9]+)-(dev|rc|stable|lts)$"
          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "Invalid branch pattern '$BRANCH'" && exit 1
          fi
          BASE_VER="${BASH_REMATCH[1]}"
          TYPE="${BASH_REMATCH[2]}"
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          REV_INDEX=$((TOTAL_COMMITS - 1))
          if [ $REV_INDEX -lt 0 ]; then REV_INDEX=0; fi
          FULL_VER="${BASE_VER}-${TYPE}+${REV_INDEX}"

          npm pkg set version="${FULL_VER}"
          echo "full_version=${FULL_VER}" >> $GITHUB_OUTPUT
          if [[ "$TYPE" == "stable" || "$TYPE" == "lts" ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies (bypassing postinstall)
        run: npm ci --ignore-scripts

      - name: Download gdal-async prebuilt binary
        run:
          node
          node_modules/gdal-async/node_modules/@mapbox/node-pre-gyp/bin/node-pre-gyp
          install --directory=node_modules/gdal-async

      - name: Generate gdal-async TypeScript definitions
        run: npm --prefix node_modules/gdal-async run yatag

      - name: Rebuild better-sqlite3 for Electron
        run:
          npx node-gyp rebuild --directory=node_modules/better-sqlite3
          --target=44.7.0 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Ensure gdal-async binding for Electron 44
        shell: bash
        run: |
          GDAL_DIR="node_modules/gdal-async/lib/binding"
          if [ -d "$GDAL_DIR/node-v137-win32-x64" ] && [ ! -d "$GDAL_DIR/electron-v44.7-win32-x64" ]; then
            cp -r "$GDAL_DIR/node-v137-win32-x64" "$GDAL_DIR/electron-v44.7-win32-x64"
          fi

      - name: Build & Package App
        run: npm run build && npm run package:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.full_version }}
          name: Cartouche v${{ steps.version.outputs.full_version }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            release/*.msi
            release/*.exe

      - name: Prune Old Releases for Current Branch
        shell: bash
        env:
          TAG_PREFIX: "v${{ steps.version.outputs.full_version }}"
          KEEP_COUNT: 3 # Number of recent releases to keep
        run: |
          # Extract prefix matching this branch's version pattern (e.g. "v1.2.3-dev+")
          BRANCH_PREFIX="${TAG_PREFIX%+*}+"

          # 1. Fetch releases matching this branch prefix, sorted newest to oldest
          # 2. Skip the newest KEEP_COUNT releases
          # 3. Delete the older releases and their underlying tags
          gh release list --limit 100 --json tagName --jq ".[].tagName" \
            | grep "^${BRANCH_PREFIX}" \
            | tail -n +$((KEEP_COUNT + 1)) \
            | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "Deleting release and tag: $tag"
                  gh release delete "$tag" --yes --cleanup-tag
                fi
              done
