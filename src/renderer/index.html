<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Cartouche</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
</head>
<body>
  <div id="app">
    <header class="menu-bar">
      <div class="menu-brand">
        <img class="app-logo" src="../../assets/logo.svg" alt="Cartouche Logo">
        <span class="app-title-badge">Cartouche</span>
      </div>
      <div class="menu-item">Project</div>
      <div class="menu-item">Edit</div>
      <div class="menu-item">View</div>
      <div class="menu-item">Layer</div>
      <div class="menu-item">Settings</div>
      <div class="menu-item">Help</div>
      <div class="menu-spacer"></div>
      <div class="window-controls">
        <button class="win-btn" id="win-min" title="Minimize" aria-label="Minimize">
          <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="win-max" title="Maximize" aria-label="Maximize">
          <svg id="icon-max" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="1" y="1" width="8" height="8"/>
          </svg>
          <svg id="icon-restore" class="hidden" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="2.5" y="0.5" width="7" height="7"/>
            <rect x="0.5" y="2.5" width="7" height="7"/>
          </svg>
        </button>
        <button class="win-btn win-close" id="win-close" title="Close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2">
            <line x1="1" y1="1" x2="9" y2="9"/>
            <line x1="9" y1="1" x2="1" y2="9"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main GIS Toolbar -->
    <nav class="toolbar">
      <button class="tool-btn active" title="Pan Tool" id="btn-pan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l3 3"/>
        </svg>
        <span>Pan</span>
      </button>
      <button class="tool-btn" title="Zoom In" id="btn-zoom-in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <span>Zoom In</span>
      </button>
      <button class="tool-btn" title="Zoom Out" id="btn-zoom-out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <span>Zoom Out</span>
      </button>
      <button class="tool-btn" title="Zoom to Full Extent" id="btn-full-extent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="15"></line>
          <line x1="15" y1="9" x2="9" y2="15"></line>
        </svg>
        <span>Full Extent</span>
      </button>

      <div class="toolbar-separator"></div>

      <button class="tool-btn" title="Add Vector Layer" id="btn-add-vector">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>+ Vector</span>
      </button>
      <button class="tool-btn" title="Add Raster Layer" id="btn-add-raster">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>+ Raster</span>
      </button>
    </nav>

    <!-- Main Workspace -->
    <main class="workbench">
      <!-- Left Dock: Layers Panel -->
      <aside class="dock-panel left-panel">
        <div class="dock-header">
          <h3>Layers</h3>
          <div class="dock-actions">
            <button class="icon-btn" title="Filter layers">🔍</button>
            <button class="icon-btn" title="Add group">📁</button>
          </div>
        </div>
        <div class="layers-list" id="layers-list">
          <div class="layer-item">
            <input type="checkbox" id="layer-osm" checked>
            <span class="layer-swatch base-tile"></span>
            <label for="layer-osm" class="layer-title">OpenStreetMap Background</label>
          </div>
          <div class="layer-item">
            <input type="checkbox" id="layer-admin" checked>
            <span class="layer-swatch polygon"></span>
            <label for="layer-admin" class="layer-title">Administrative Boundaries</label>
          </div>
          <div class="layer-item">
            <input type="checkbox" id="layer-points" checked>
            <span class="layer-swatch point"></span>
            <label for="layer-points" class="layer-title">Sample POI Markers</label>
          </div>
        </div>
      </aside>

      <!-- Center: Map Canvas Viewport -->
      <section class="map-viewport" id="map-viewport">
        <div class="map-grid-overlay" id="map-grid"></div>
        <div class="viewport-hud">
          <div class="hud-box">Cartouche Geospatial Viewport</div>
        </div>
      </section>

      <!-- Right Dock: Feature Inspector / Properties -->
      <aside class="dock-panel right-panel">
        <div class="dock-header">
          <h3>Properties & Attributes</h3>
        </div>
        <div class="dock-content">
          <div class="property-group">
            <label>Selected Feature</label>
            <div class="property-value" id="selected-feature-info">None</div>
          </div>
          <div class="property-group">
            <label>Coordinate Reference System</label>
            <div class="property-value">WGS 84 / Pseudo-Mercator</div>
          </div>
          <div class="property-group">
            <label>Renderer</label>
            <div class="property-value" id="electron-version-info">Electron Core</div>
          </div>
        </div>
      </aside>
    </main>

    <!-- Bottom Status Bar -->
    <footer class="status-bar">
      <div class="status-item" id="status-coord">Coordinate: 0.000000°, 0.000000°</div>
      <div class="status-separator"></div>
      <div class="status-item" id="status-scale">Scale: 1 : 1,000,000</div>
      <div class="status-separator"></div>
      <div class="status-item" id="status-crs">EPSG:3857</div>
      <div class="status-spacer"></div>
      <div class="status-item status-ready">● Ready</div>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
